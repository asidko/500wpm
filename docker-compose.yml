version: '3.8'

services:
  speed-reader:
    build: .
    container_name: speed-reader
    ports:
      - "8000:8000"  # Single port - Go server serves both API and static files
    volumes:
      - speed-reader-data:/app/data  # Persist SQLite database
    restart: unless-stopped
    environment:
      - PORT=8000
      - RATE_LIMIT=2.0
      - DATABASE_PATH=/app/data/books.db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  speed-reader-data:
